name: Lottery Predictor Refresh

on:
  schedule:
    # Refresh every 10 minutes. GitHub uses UTC; the script uses TZ below.
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: lottery-predictor-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run V1 stable scoring
        run: python lottery_predictor.py predict
        timeout-minutes: 8

      - name: Run V2 constraint sampling
        run: python lottery_predictor_v2.py predict
        timeout-minutes: 8

      - name: Run post-draw review after 22:00 Beijing time
        shell: bash
        run: |
          hour="$(date +%H)"
          if [ "$hour" -ge 22 ]; then
            python lottery_predictor.py post-draw
            python lottery_predictor_v2.py post-draw
          else
            echo "Before 22:00 Beijing time; prediction refresh only."
          fi
        timeout-minutes: 10

      - name: Commit data and reports to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json config_v2.json data data_v2 reports
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update lottery predictor reports"
            git push
          fi

      - name: Publish reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          publish_branch: gh-pages
          keep_files: false
          full_commit_message: "Publish lottery predictor reports"
